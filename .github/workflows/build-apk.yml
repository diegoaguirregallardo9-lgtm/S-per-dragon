name: AURA CLASH - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'AuraClash_2D_Bluetooth.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Descomprimir juego HTML
        shell: bash
        run: |
          mkdir -p proyecto
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*bluetooth*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No hay ningún ZIP del juego en la raíz del repositorio. Sube el ZIP del juego y vuelve a ejecutar."
            exit 1
          fi
          echo "Usando archivo: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d proyecto
          # Algunos ZIP subidos contienen el ZIP real del juego en su interior.
          # Extraer archivos ZIP anidados antes de buscar el HTML principal.
          for level in 1 2 3; do
            NESTED_ZIP="$(find proyecto -type f -iname '*.zip' ! -path '*/__MACOSX/*' -print -quit)"
            if [ -z "$NESTED_ZIP" ]; then
              break
            fi
            echo "Extrayendo ZIP interno (nivel $level): $NESTED_ZIP"
            NESTED_DIR="$(dirname "$NESTED_ZIP")"
            unzip -o "$NESTED_ZIP" -d "$NESTED_DIR"
            rm -f "$NESTED_ZIP"
          done
          HTML="$(find proyecto -type f ! -path '*/__MACOSX/*' \( -iname 'index.html' -o -iname 'index.htm' -o -iname '*.html' -o -iname '*.htm' \) | head -1)"
          if [ -z "$HTML" ]; then
            echo "::error::No encontré ningún archivo HTML dentro del ZIP Bluetooth subido."
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi
          WEB_ROOT="$(dirname "$HTML")"
          if [ -f "./AuraClash_2D_Bluetooth.html" ]; then
            cp "./AuraClash_2D_Bluetooth.html" "$WEB_ROOT/index.html"
            echo "Usando el HTML Bluetooth actualizado desde la raíz del repositorio."
          fi
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"
          echo "Juego encontrado en: $WEB_ROOT"

      - name: Crear ZIP actualizado con el HTML Bluetooth
        shell: bash
        run: |
          rm -f AuraClash_2D_Bluetooth_ACTUALIZADO.zip
          (cd proyecto && zip -qr ../AuraClash_2D_Bluetooth_ACTUALIZADO.zip .)
          unzip -l AuraClash_2D_Bluetooth_ACTUALIZADO.zip | head -40

      - name: Preparar firma permanente
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dragon-super-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/dragon-super-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dragon-super-release.jks" >> "$GITHUB_ENV"
            echo "Firma permanente validada."
          else
            echo "::warning::Faltan uno o más secretos de firma. Se usará firma debug temporal; agrega los cuatro secretos para una APK definitiva actualizable."
          fi

      - name: Crear estructura Android automáticamente
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/auraclash/game
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          cp -R "$WEB_ROOT"/. app/src/main/assets/www/
          HTML_FILE="$(find "$WEB_ROOT" -maxdepth 1 -type f ! -path '*/__MACOSX/*' \( -iname '*.html' -o -iname '*.htm' \) | head -1)"
          if [ -z "$HTML_FILE" ]; then
            echo "::error::No encontré el archivo HTML principal."
            exit 1
          fi
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          echo "HTML principal preparado: $HTML_FILE"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AuraClash"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.auraclash.game'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.auraclash.game'
                  minSdk 23
                  targetSdk 35
                  versionCode = (project.findProperty("VERSION_CODE") ?: "1").toString().toInteger()
                  versionName "1.0"
              }

              def signingReady = ["ANDROID_KEYSTORE_PATH", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"].every { System.getenv(it)?.trim() }

              signingConfigs {
                  if (signingReady) {
                      release {
                          storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      if (signingReady) {
                          signingConfig signingConfigs.release
                      }
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="Dragón Súper"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C3AED</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/auraclash/game/MainActivity.java <<'EOF'
          package com.auraclash.game;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothServerSocket;
          import android.bluetooth.BluetoothSocket;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.IOException;
          import java.util.UUID;

          public class MainActivity extends Activity {
              private static final int BT_PERMISSION_REQUEST = 701;
              private static final UUID APP_UUID = UUID.fromString("7c4a9d20-6b31-4f52-9e81-2a6d8c0b5f11");
              private WebView webView;
              private BluetoothAdapter adapter;
              private BluetoothSocket socket;
              private BluetoothServerSocket serverSocket;
              private Thread worker;
              private volatile boolean running = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  adapter = BluetoothAdapter.getDefaultAdapter();
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new BluetoothBridge(), "AndroidBluetooth");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/www/index.html");
                  hideSystemUI();
              }

              private boolean hasBluetoothPermission() {
                  return Build.VERSION.SDK_INT < 31 ||
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBluetoothPermission() {
                  if (Build.VERSION.SDK_INT >= 31 && !hasBluetoothPermission()) {
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN}, BT_PERMISSION_REQUEST);
                  }
              }

              private void emit(String event, String value) {
                  if (webView == null) return;
                  String safe = value == null ? "" : value.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n").replace("\r", "");
                  runOnUiThread(() -> webView.evaluateJavascript(
                      "window.dispatchEvent(new CustomEvent('" + event + "',{detail:'" + safe + "'}));", null));
              }

              private synchronized void closeConnection() {
                  running = false;
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception ignored) {}
                  socket = null;
                  serverSocket = null;
                  emit("bluetoothstatus", "disconnected");
              }

              private void readMessages(BluetoothSocket connected) {
                  try {
                      BufferedReader reader = new BufferedReader(new InputStreamReader(connected.getInputStream(), "UTF-8"));
                      String line;
                      while (running && (line = reader.readLine()) != null) emit("bluetoothmessage", line);
                  } catch (Exception e) {
                      emit("bluetoothstatus", "connection_lost");
                  } finally {
                      closeConnection();
                  }
              }

              private class BluetoothBridge {
                  @JavascriptInterface public String isSupported() { return adapter == null ? "false" : "true"; }

                  @JavascriptInterface public void startServer() {
                      if (adapter == null) { emit("bluetoothstatus", "unsupported"); return; }
                      if (!hasBluetoothPermission()) { requestBluetoothPermission(); emit("bluetoothstatus", "permission_required"); return; }
                      if (!adapter.isEnabled()) { emit("bluetoothstatus", "bluetooth_off"); return; }
                      closeConnection();
                      running = true;
                      worker = new Thread(() -> {
                          try {
                              serverSocket = adapter.listenUsingRfcommWithServiceRecord("AuraClash", APP_UUID);
                              emit("bluetoothstatus", "waiting");
                              BluetoothSocket accepted = serverSocket.accept();
                              socket = accepted;
                              try { serverSocket.close(); } catch (Exception ignored) {}
                              emit("bluetoothstatus", "connected");
                              readMessages(accepted);
                          } catch (Exception e) {
                              emit("bluetoothstatus", "server_error");
                              closeConnection();
                          }
                      });
                      worker.start();
                  }

                  @JavascriptInterface public void connect(String address) {
                      if (adapter == null) { emit("bluetoothstatus", "unsupported"); return; }
                      if (!hasBluetoothPermission()) { requestBluetoothPermission(); emit("bluetoothstatus", "permission_required"); return; }
                      if (!adapter.isEnabled()) { emit("bluetoothstatus", "bluetooth_off"); return; }
                      closeConnection();
                      running = true;
                      worker = new Thread(() -> {
                          try {
                              BluetoothDevice device = adapter.getRemoteDevice(address.trim());
                              BluetoothSocket connected = device.createRfcommSocketToServiceRecord(APP_UUID);
                              adapter.cancelDiscovery();
                              connected.connect();
                              socket = connected;
                              emit("bluetoothstatus", "connected");
                              readMessages(connected);
                          } catch (Exception e) {
                              emit("bluetoothstatus", "connect_error");
                              closeConnection();
                          }
                      });
                      worker.start();
                  }

                  @JavascriptInterface public void send(String message) {
                      new Thread(() -> {
                          try {
                              BluetoothSocket current = socket;
                              if (current == null || !current.isConnected()) { emit("bluetoothstatus", "not_connected"); return; }
                              OutputStream out = current.getOutputStream();
                              out.write((message + "\\n").getBytes("UTF-8"));
                              out.flush();
                          } catch (Exception e) { emit("bluetoothstatus", "send_error"); }
                      }).start();
                  }

                  @JavascriptInterface public void disconnect() { closeConnection(); }
                  @JavascriptInterface public String getDeviceName() {
                      try { return hasBluetoothPermission() && adapter != null ? adapter.getName() : "Android"; }
                      catch (Exception e) { return "Android"; }
                  }
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == BT_PERMISSION_REQUEST) {
                      emit("bluetoothstatus", grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED
                          ? "permission_granted" : "permission_denied");
                  }
              }

              @Override public void onDestroy() {
                  closeConnection();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          echo "Estructura Android creada:"
          find . -maxdepth 5 -type f | sort | head -100

      - name: Generar iconos de Dragón Súper
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 48 -h 48 android/icon/dragon-super.svg -o app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 android/icon/dragon-super.svg -o app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 android/icon/dragon-super.svg -o app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 android/icon/dragon-super.svg -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 android/icon/dragon-super.svg -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK firmada
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            gradle --no-daemon -PVERSION_CODE="$GITHUB_RUN_NUMBER" assembleRelease
          else
            gradle --no-daemon -PVERSION_CODE="$GITHUB_RUN_NUMBER" assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-SUPER-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Guardar ZIP actualizado del juego
        uses: actions/upload-artifact@v4
        with:
          name: AURACLASH-BLUETOOTH-ZIP-ACTUALIZADO
          path: AuraClash_2D_Bluetooth_ACTUALIZADO.zip
          if-no-files-found: error
