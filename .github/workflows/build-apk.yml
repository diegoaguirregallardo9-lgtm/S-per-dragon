name: AURA CLASH - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AuraClash_proyecto.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en el runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Descomprimir proyecto nuevo
        run: |
          mkdir -p proyecto
          unzip -o AuraClash_proyecto.zip -d proyecto
          echo "Archivos encontrados:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Buscar proyecto Android
        id: find
        shell: bash
        run: |
          SETTINGS="$(find proyecto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)"
          if [ -n "$SETTINGS" ]; then
            ROOT="$(dirname "$SETTINGS")"
          else
            BUILD="$(find proyecto -type f \( -name build.gradle -o -name build.gradle.kts \) | head -1)"
            if [ -z "$BUILD" ]; then
              echo "El ZIP no contiene un proyecto Android Gradle. Contiene archivos HTML/web y necesita una plantilla Android para generar el APK."
              exit 1
            fi
            ROOT="$(dirname "$BUILD")"
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          cd "${{ steps.find.outputs.root }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-CLASH-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
