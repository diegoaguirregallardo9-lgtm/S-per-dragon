
name: Build AURA CLASH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          unzip AuraClash_iPhone_CloudBuild.zip -d proyecto

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          cd proyecto
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-CLASH-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
