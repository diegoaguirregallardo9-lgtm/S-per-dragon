
name: AURA CLASH - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AuraClash_proyecto.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Descomprimir proyecto nuevo
        run: |
          mkdir -p proyecto
          unzip -o AuraClash_proyecto.zip -d proyecto
          echo "Contenido del proyecto:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Buscar proyecto Android
        id: find
        run: |
          GRADLE_FILE=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -1)

          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find proyecto -name build.gradle -o -name build.gradle.kts | head -1)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "No se encontró un proyecto Gradle Android."
            exit 1
          fi

          ROOT=$(dirname "$GRADLE_FILE")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          cd "${{ steps.find.outputs.root }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-CLASH-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
