
name: Build AURA CLASH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          unzip -q AuraClash_iPhone_CloudBuild.zip -d proyecto

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew dentro del ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-CLASH-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
